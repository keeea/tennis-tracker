<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#081018" />
    <meta name="description" content="Track tennis points, stats, and match history offline." />
    <title>Tennis Tracker</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/icon-192.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      tailwind = window.tailwind || {};
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Space Grotesk", "ui-sans-serif", "system-ui"],
              mono: ["IBM Plex Mono", "ui-monospace", "monospace"],
            },
            colors: {
              court: {
                950: "#081018",
                900: "#0d1621",
                800: "#142433",
                700: "#1e3448",
                600: "#2a4f68",
                400: "#5fc9cb",
                300: "#8df1d5",
                200: "#d7fff1",
              },
              clay: {
                500: "#f08f54",
                400: "#ffad72",
              },
            },
            boxShadow: {
              panel: "0 18px 40px rgba(0, 0, 0, 0.32)",
            },
          },
        },
      };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      :root {
        color-scheme: dark;
      }

      body {
        min-height: 100vh;
        background:
          radial-gradient(circle at top, rgba(95, 201, 203, 0.18), transparent 34%),
          linear-gradient(180deg, #0b1520 0%, #081018 48%, #050b12 100%);
      }

      .safe-pad {
        padding-bottom: calc(1.25rem + env(safe-area-inset-bottom));
      }
    </style>
  </head>
  <body class="bg-court-950 text-court-200 antialiased">
    <div id="app" class="mx-auto min-h-screen max-w-6xl safe-pad"></div>
    <script src="https://unpkg.com/dexie@4.0.8/dist/dexie.min.js"></script>
    <script defer src="./app.js"></script>
  </body>
</html>
